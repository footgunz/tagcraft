# When a release is published in the GitHub UI, build the app from the release's tag, then:
#   - attach the public single-file app (open-licensed fonts only) to the release as tagcraft-<tag>.html
#   - publish it to GitHub Pages
# It can also be run by hand from the Actions tab; that only updates Pages.
name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the file to the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so a manual run is versioned by git describe
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The public build: open-licensed fonts only, safe to publish.
      - run: npm run build:public
        env:
          # The version shown in the app: the release's tag (empty on a manual run).
          TAGCRAFT_VERSION: ${{ github.event.release.tag_name }}
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp dist/tagcraft-public.html "tagcraft-${TAG}.html"
          gh release upload "$TAG" "tagcraft-${TAG}.html" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Stage site
        run: |
          mkdir -p _site
          cp dist/tagcraft-public.html _site/index.html
          # Read by the app to notice a cached older copy and load this release.
          cp dist/version.json _site/version.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
