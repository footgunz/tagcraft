# Runs the unit tests and a type-checked build on every pull request and on pushes to main.
# The "test" job is the required status check for merging PRs.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Newer pushes to the same PR supersede older runs.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
